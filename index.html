<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Starlink Stats</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; max-width: 1100px; margin-bottom: 2rem; overflow-x: auto; display: block; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    caption { text-align: left; font-weight: bold; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <h1>Starlink: последние итоги (Total / Subtotal)</h1>
  <div id="stats">Загрузка...</div>

  <script>
    fetch('data.json')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(data => {
        const allRows = data.all_rows || [];
        if (!allRows.length) {
          document.getElementById('stats').textContent = 'Нет данных';
          return;
        }

        // Первая строка — заголовки столбцов (Mission, Total Sats Launched, ...)
        const headers = allRows[0];

        // Фильтруем строки: Total, Subtotal *, Total Star
        const filtered = allRows.slice(1).filter(row => {
          const first = (row[0] || "").toLowerCase();
          return (
            first === 'total' ||
            first === 'total star' ||
            first.startsWith('subtotal')
          );
        });

        if (!filtered.length) {
          document.getElementById('stats').textContent = 'Нет строк Total/Subtotal';
          return;
        }

        const container = document.getElementById('stats');
        let html = '';

        for (const row of filtered) {
          html += '<table>';
          html += '<caption>' + (row[0] || 'Итоги') + '</caption>';
          html += '<tr>';

          // Заголовки
          for (let i = 0; i < headers.length; i++) {
            html += '<th>' + (headers[i] || '') + '</th>';
          }
          html += '</tr>';

          // Данные
          html += '<tr>';
          for (let i = 0; i < headers.length; i++) {
            html += '<td>' + (row[i] !== undefined ? row[i] : '') + '</td>';
          }
          html += '</tr>';

          html += '</table><br>';
        }

        container.innerHTML = html;
      })
      .catch(err => {
        document.getElementById('stats').textContent = 'Ошибка: ' + err;
      });
  </script>
</body>
</html>
